<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3B414D"/><stop offset="1" stop-color="#16191E"/>
    </linearGradient>
    <linearGradient id="mouth" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#07090B"/><stop offset="1" stop-color="#101318"/>
    </linearGradient>
    <radialGradient id="glow" cx="512" cy="610" r="200" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#C8FFE0"/>
      <stop offset=".12" stop-color="#5EF2A0" stop-opacity=".95"/>
      <stop offset=".45" stop-color="#30D158" stop-opacity=".35"/>
      <stop offset="1" stop-color="#30D158" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7CF5A6"/><stop offset="1" stop-color="#28B84E"/>
    </linearGradient>
    <linearGradient id="hl" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity=".22"/><stop offset=".5" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#000" flood-opacity=".32"/>
    </filter>
    <filter id="bloom" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="10" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#bg)" filter="url(#shadow)"/>
  <!-- the tunnel's mouth, its rings receding toward the light at its end -->
  <path d="M242 800V530a270 270 0 0 1 540 0v270Z" fill="url(#mouth)"/>
  <circle cx="512" cy="610" r="200" fill="url(#glow)"/>
  <g fill="none" stroke-linecap="round">
    <path d="M336 744V560a176 176 0 0 1 352 0v184" stroke="#30D158" stroke-width="20" stroke-opacity=".55"/>
    <path d="M408 700V590a104 104 0 0 1 208 0v110" stroke="#30D158" stroke-width="13" stroke-opacity=".32"/>
    <path d="M242 800V530a270 270 0 0 1 540 0v270" stroke="url(#ring)" stroke-width="40" filter="url(#bloom)"/>
  </g>
  <rect x="101.5" y="101.5" width="821" height="821" rx="183.5" fill="none" stroke="url(#hl)" stroke-width="3"/>
</svg>
